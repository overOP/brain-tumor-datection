[project]
name = "brain-tumor-detection"
version = "0.1.0"
description = "Brain tumor detection on MRI images with YOLOv8, FastAPI and Docker"
readme = "README.md"
authors = [
    { name = "Pradeep_Chy", email = "cgpradeepop@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pi-heif>=1.4.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "torchvision",
    "ultralytics>=8.4.174",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brain_tumor"

# On Linux (Docker) use the small CPU-only PyTorch build.
# macOS keeps the normal PyPI build with Apple GPU (MPS) support.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "kaggle>=2.2.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
